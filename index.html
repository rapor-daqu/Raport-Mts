.brand img{width:64px;height:64px;object-fit:contain}
.brand b{display:block;font:700 26px/1.1 'Source Serif 4',Georgia,serif;color:var(--blue);letter-spacing:.5px}
.brand span{color:var(--mute);font-size:13px}
nav{max-width:1100px;margin:auto;padding:0 16px;display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:10px 14px;color:var(--ink);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-4px}
nav a.on{color:var(--green);border-color:var(--gold)}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font:700 20px 'Source Serif 4',Georgia,serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>label{flex:1 1 150px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #b9c0cd;border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #9db0ff;outline-offset:1px}
button{padding:9px 16px;border:0;border-radius:6px;background:var(--green);color:#fff;font:600 14px 'Public Sans',sans-serif;cursor:pointer}
button.alt{background:#fff;color:var(--ink);border:1px solid #b9c0cd}button.del{background:#fff;color:#a4262c;border:1px solid #e3b5b8}
table.t{width:100%;border-collapse:collapse}.t th,.t td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{font-size:13px;color:var(--mute)}.t input,.t select{padding:5px 7px}.scroll{overflow-x:auto}
.ok{color:var(--green);font-size:13px;font-weight:600}.mute{color:var(--mute)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:0 auto 16px;padding:8mm 11mm;box-sizing:border-box;font:9.5pt/1.25 'Source Serif 4','Times New Roman',serif;color:#000;border:1px solid var(--line)}
.sheet .ar{font-family:'Amiri','Traditional Arabic',serif;direction:rtl;unicode-bidi:isolate;font-size:1.12em}
.sheet img.kop{width:100%;display:block}.sheet .ttl{text-align:center;font-weight:700;font-size:11.5pt;margin:5px 0}
.sheet table{width:100%;border-collapse:collapse;margin:4px 0 6px}.sheet td,.sheet th{border:1px solid #000;padding:1.5px 4px;text-align:center;vertical-align:middle}
.sheet td.l,.sheet th.l{text-align:left}.sheet tr.g td{background:#e8eef0;font-weight:700;text-align:left}.sheet table.id td{border:0;text-align:left;padding:1px 4px}
.sheet .hf,.sheet .kt{font-size:7pt;line-height:1.15}.sheet .hd{text-align:center;font-weight:700;margin-bottom:6px}.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sheet .bx{border:1px solid #000;padding:4px 6px;margin:4px 0;min-height:36px}.sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;margin-top:10px}.sig>div{min-height:95px;display:flex;flex-direction:column;justify-content:space-between}#v{overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:20px;background:#fff}.chip button{padding:0 9px;border-radius:12px}
@media print{body{background:#fff}.top,.noprint{display:none!important}main{margin:0;padding:0;max-width:none}.sheet{border:0;margin:0;page-break-after:always;width:210mm;min-height:297mm}#v{overflow:visible}@page{size:A4;margin:0}}
</style>
</head>

const key=id=>`${S.set.ta}|${S.set.sem}|${id}`,num=x=>x===''||x==null?null:+x,f=x=>x==null?'':x;
const avg=a=>{a=a.filter(x=>x!=null);return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):null};
const pred=n=>n>=90?'A':n>=80?'B':n>=70?'C':'D',SK={A:'Sangat Baik',B:'Baik',C:'Cukup',D:'Kurang'};

const setPath=(o,p,v)=>{const k=p.split('.');k.slice(0,-1).forEach(x=>o=o[x]??(o[x]={}));o[k.pop()]=v};

const rank=s=>{const me=mean(s.id);if(me==null)return'';const all=S.santri.filter(x=>x.kelas===s.kelas).map(x=>mean(x.id)).filter(x=>x!=null);return 1+all.filter(x=>x>me).length+' dari '+all.length};

const V=$('#v');

const views={
santri(){const e=S.santri.find(s=>s.id===edit)||{};const q=sel.kelas;
V.innerHTML=`<div class="card"><h2>${edit?'Ubah data santri':'Tambah santri'}</h2><form id="fs"><div class="row">
<label>Nama lengkap<input name="nama" required value="${esc(e.nama)}"></label><label>NIS<input name="nis" value="${esc(e.nis)}"></label><label>NISN<input name="nisn" value="${esc(e.nisn)}"></label>

<button>${edit?'Simpan perubahan':'Tambah santri'}</button>${edit?'<button type="button" class="alt" id="bc">Batal</button>':''}</div></form></div>
<div class="card"><h2>Unggah data santri dari Excel</h2><p class="mute">Unduh templat, isi data satu kelas, lalu unggah. Kolom: Nama, NIS, NISN, Jenis Kelamin, Tempat Tanggal Lahir, Orang Tua/Wali. Santri dengan NIS yang sama di kelas itu akan diperbarui.</p><div class="row"><label>Masukkan ke kelas<select id="xk">${opts(kelasList(),sel.kelas)}</select></label><label>Berkas Excel (.xlsx, .xls, .csv)<input type="file" id="xf" accept=".xlsx,.xls,.csv"></label><button class="alt" id="xt" type="button">Unduh templat Excel</button></div><p id="xm" class="ok" role="status"></p></div>
